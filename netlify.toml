[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Long-lived cache for hashed assets (JS/CSS with content hash in filename)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Medium cache for optimized images (regenerated on each deploy but content rarely changes)
[[headers]]
  for = "/images/opt/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Videos — cache for a week
[[headers]]
  for = "/video/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
